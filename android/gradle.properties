org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Workaround: Kotlin daemon incremental cache failures on Windows (often when project is on a different drive).
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process

# Fix for contacts_service namespace issue
android.defaults.namespace=dev.flutter.plugins.contacts_service
